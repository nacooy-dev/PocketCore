<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketCore 对话助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 80vh;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .chat-header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .chat-header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 12px 15px;
            border-radius: 18px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .user-message {
            background: #667eea;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }
        
        .assistant-message {
            background: #e9ecef;
            color: #333;
            margin-right: auto;
            border-bottom-left-radius: 5px;
        }
        
        .tool-message {
            background: #d4edda;
            color: #155724;
            margin-right: auto;
            border-bottom-left-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }
        
        .chat-input {
            display: flex;
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
        }
        
        .chat-input input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            outline: none;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .chat-input input:focus {
            border-color: #667eea;
        }
        
        .chat-input button {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            margin-left: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        
        .chat-input button:hover {
            background: #5a67d8;
        }
        
        .chat-input button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .tools-info {
            padding: 15px 20px;
            background: #e9ecef;
            border-top: 1px solid #ddd;
            font-size: 0.9rem;
            color: #666;
        }
        
        .tools-info h3 {
            margin-bottom: 8px;
            color: #495057;
        }
        
        .tools-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .tool-tag {
            background: #667eea;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #28a745;
            margin-right: 5px;
        }
        
        .status-offline {
            background: #dc3545;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>PocketCore 对话助手</h1>
            <p>智能助手 <span id="status-indicator"><span class="status-indicator"></span>在线</span></p>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message assistant-message">
                你好！我是PocketCore智能对话助手。我可以帮你：
                <ul>
                    <li>🧮 计算数学表达式</li>
                    <li>🌐 翻译文本</li>
                    <li>🔍 搜索信息</li>
                    <li>📋 查看可用模型</li>
                </ul>
                有什么可以帮助你的吗？
            </div>
        </div>
        
        <div class="tools-info">
            <h3>可用工具</h3>
            <div class="tools-list">
                <span class="tool-tag">计算器</span>
                <span class="tool-tag">翻译器</span>
                <span class="tool-tag">搜索引擎</span>
                <span class="tool-tag">模型发现</span>
            </div>
        </div>
        
        <div class="chat-input">
            <input type="text" id="message-input" placeholder="输入你的问题..." autocomplete="off">
            <button id="send-button">发送</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const statusIndicator = document.getElementById('status-indicator');
        
        // 添加消息到聊天界面
        function addMessage(content, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            
            // 如果是工具调用消息，特殊处理
            if (sender === 'assistant' && content.startsWith('{"action":')) {
                try {
                    const toolCall = JSON.parse(content);
                    messageDiv.className = 'message tool-message';
                    messageDiv.innerHTML = `<strong>🔧 工具调用:</strong><br>工具: ${toolCall.action}<br>参数: ${JSON.stringify(toolCall.parameters)}`;
                } catch (e) {
                    messageDiv.textContent = content;
                }
            } else {
                messageDiv.textContent = content;
            }
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // 发送消息到后端
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            
            // 添加用户消息
            addMessage(message, 'user');
            messageInput.value = '';
            
            // 禁用发送按钮
            sendButton.disabled = true;
            sendButton.textContent = '发送中...';
            
            try {
                const response = await fetch('/dialogue', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: message })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addMessage(data.response, 'assistant');
                } else {
                    const errorText = await response.text();
                    addMessage(`❌ 错误: ${response.status} - ${errorText}`, 'assistant');
                    // 更新状态为离线
                    statusIndicator.innerHTML = '<span class="status-indicator status-offline"></span>离线';
                }
            } catch (error) {
                addMessage(`❌ 网络错误: ${error.message}`, 'assistant');
                // 更新状态为离线
                statusIndicator.innerHTML = '<span class="status-indicator status-offline"></span>离线';
            } finally {
                // 重新启用发送按钮
                sendButton.disabled = false;
                sendButton.textContent = '发送';
            }
        }
        
        // 事件监听器
        sendButton.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', () => {
            messageInput.focus();
        });
        
        // 测试API连接
        async function testConnection() {
            try {
                const response = await fetch('/tools');
                if (response.ok) {
                    statusIndicator.innerHTML = '<span class="status-indicator"></span>在线';
                } else {
                    statusIndicator.innerHTML = '<span class="status-indicator status-offline"></span>离线';
                }
            } catch (error) {
                statusIndicator.innerHTML = '<span class="status-indicator status-offline"></span>离线';
            }
        }
        
        // 页面加载时测试连接
        testConnection();
    </script>
</body>
</html>
